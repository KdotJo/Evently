# CI: lint → tests (+coverage) → SonarQube Cloud → container image to GHCR (main only).
#
# Secrets/variables to set in the repository:
#   SONAR_TOKEN            SonarQube Cloud → My Account → Security (project or org token)
#   (GITHUB_TOKEN)         built in; used to push to ghcr.io/<owner>/evently-api
# Gitar reviews PRs as a GitHub App (no workflow step): install it from app.gitar.ai and it reads
# `.gitar/rules/*.md` from this repo. See docs/DEPLOYMENT.md → "CI".

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/evently-api

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff report for Sonar
        if: always()
        run: ruff check --output-format=json --exit-zero -o ruff-report.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-report
          path: ruff-report.json
          retention-days: 7

  test:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # pytest-cov is a CI-only addition (not in pyproject): it produces the Cobertura XML Sonar reads.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel]" pytest-cov
      - name: Tests with coverage
        run: |
          pytest tests -q \
            --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered \
            --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            pytest-report.xml
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Dependabot PRs and forks have no access to SONAR_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history → accurate new-code detection and blame
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
      - uses: actions/download-artifact@v4
        with:
          name: ruff-report
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Project key + organization live in sonar-project.properties. Extra args example:
        # with:
        #   args: -Dsonar.projectVersion=${{ github.sha }}

  docker-build:
    name: Container image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign / provenance, if enabled later
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=evently-api
            org.opencontainers.image.description=Evently backend (FastAPI)
      - name: Build (and push on main / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
